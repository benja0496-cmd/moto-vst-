name: Build MotoCross Engine for Akai Force
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 0.1.0)"
        required: true
        default: "0.1.0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
      - name: Get SD88 build kit
        run: git clone --depth 1 https://github.com/sd88me/mpc-vst-plugins.git "$RUNNER_TEMP/mpc-vst-plugins"
      - name: Build ARM VST
        env:
          MPC_VST: ${{ runner.temp }}/mpc-vst-plugins
        run: |
          chmod +x vst/build.sh
          ./vst/build.sh
      - name: Test source
        run: |
          "$RUNNER_TEMP/mpc-vst-plugins/tools/test_port.sh" vst/vst.json
      - name: Package installation ZIP
        env:
          MPC_VST: ${{ runner.temp }}/mpc-vst-plugins
          VERSION: ${{ inputs.version }}
        run: |
          python3 "$MPC_VST/tools/release.py" \
            --so "vst/build/motocross_engine.so" \
            --skin "vst/build/skin/BenjaLab - VST - MotoCross Engine" \
            --entry "vst/build/pluginlist-entry.xml" \
            --version "$VERSION" \
            --about "Synthetic motocross engine with throttle and engine type controls." \
            -o dist
      - name: Upload installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MotoCross-Engine-Force-${{ inputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
